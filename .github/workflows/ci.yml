name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # So a run can be asked for by hand. Measured in the sibling repo: a push does not always
  # create one, and without this trigger there is no way to ask for the verdict it should have
  # produced. Cheap insurance on the one path that decides whether a change is good.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod's directive, not a hand-written pin: the pin said 1.22 while
          # go.mod asked for 1.26.5, so the job only worked because Go fetched the
          # toolchain the module wanted and ignored the pin.
          go-version-file: go.mod
      - uses: ./.github/actions/install-harper
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      # Every package, not just ./internal/api/: the engine and LSP client are where
      # the concurrency and protocol bugs live.
      - run: go test -timeout 300s ./...
      - run: go build -o grammar-server ./cmd/server

  # The claim the product is sold on: a real LanguageTool client talks to a running
  # server. Hand-testing found a missing longCode that curl could never see — the PyPI
  # client read None into its language set and died before its first check — so the
  # library is now a gate rather than a thing someone remembers to run.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/install-harper
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start the server
        run: |
          go build -o grammar-server ./cmd/server
          ./grammar-server --host 127.0.0.1 --port 8875 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8875/status > status.json; then break; fi
            sleep 1
          done
          if [ ! -s status.json ]; then echo "the server never answered /status"; exit 1; fi
          python3 -c 'import json; d=json.load(open("status.json")); print("server", d["version"], "on", d["dialect"])'
      - run: pip install --quiet language_tool_python
      - name: Real client contract
        run: python examples/lt-client-smoke.py
      - name: Server log on failure
        if: failure()
        run: journalctl --no-pager 2>/dev/null | tail -40 || true
