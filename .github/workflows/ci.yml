name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod's directive, not a hand-written pin: the pin said 1.22 while
          # go.mod asked for 1.26.5, so the job only worked because Go fetched the
          # toolchain the module wanted and ignored the pin.
          go-version-file: go.mod
      - name: Install harper
        run: |
          # Keep this in step with the pair deployed beside the service: the rule
          # drift tests below compare the mappings in this repo against this CLI's
          # rule list, so a stale pin means CI stops noticing renames upstream.
          base=https://github.com/Automattic/harper/releases/download/v2.11.0
          curl -fsSL "$base/harper-ls-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          curl -fsSL "$base/harper-cli-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv harper-ls harper-cli /usr/local/bin/
          harper-ls --version
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      # Every package, not just ./internal/api/: the engine and LSP client are where
      # the concurrency and protocol bugs live.
      - run: go test -timeout 300s ./...
      - run: go build -o grammar-server ./cmd/server
